[project]
name = "retail-analytics-platform"
version = "0.1.0"
description = "End-to-end retail analytics and demand forecasting platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dbt_project/target", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["dbt_project/target", "mlruns", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
