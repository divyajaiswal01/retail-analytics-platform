name: retail_analytics
version: "1.0.0"
config-version: 2
profile: retail_analytics
 
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]
 
# Analysis window decided in Phase 3 (see docs/data_findings.md, finding #2).
# Rows outside the window are KEPT in the facts and flagged via in_analysis_window.
vars:
  analysis_start_date: "2017-01-01"
  analysis_end_date: "2018-08-31"
 
  # Phase 5 analysis settings
  yoy_current_start: "2018-01-01"   # growth compares this period with the same dates one year earlier
  yoy_current_end: "2018-08-31"
  repeat_horizon_days: 180          # a customer "repeats" if they order again within this many days
  seller_min_orders: 30             # sellers below this volume are not ranked (too noisy)
 
models:
  retail_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

